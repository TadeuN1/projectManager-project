server:
  servlet:
    context-path: /
  port: 8080
spring:
  data:
    mongodb:
      host: ${SPRING_DATA_MONGODB_HOST:localhost}
      port: ${SPRING_DATA_MONGODB_PORT:27017}
      database: ${SPRING_DATA_MONGODB_DATABASE:pmanagerdb}
  jackson:
    default-property-inclusion: non_null
  application:
    name: PManager
  datasource:
#    url: jdbc:h2:mem:test
#    driverClassName: org.h2.Driver
#    username: sa
#    password:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/pmanagerdb}
    driverClassName: com.mysql.cj.jdbc.Driver
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
#  h2:
#    console:
#      enabled: true
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
app:
  general:
    pageSize: 3
  security:
    masterApiKey: ${APP_SECURITY_MASTER_API_KEY:thekey}
    expirationDays: 2
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}